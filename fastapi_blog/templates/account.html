{% extends "layout.html" %} {% block content %}

<link rel="stylesheet" href="/static/css/create.css" />

<a href="/users/{{ current_user.id }}/posts" class="back-link">
  <span class="back-arrow">←</span> My posts
</a>

<div class="account-layout">

  <section class="account-section" id="profile-form">
    <h2 class="account-section-title">Profile Information</h2>

    <div id="profile-error" class="form-error" style="display:none"></div>

    <div class="create-form">
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input
          class="field-input"
          type="text"
          id="username"
          value="{{ current_user.username }}"
          maxlength="50"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input
          class="field-input"
          type="email"
          id="email"
          value="{{ current_user.email }}"
          maxlength="150"
          autocomplete="email"
        />
      </div>

      <div class="form-footer" style="justify-content:flex-end;">
        <button class="btn-submit" id="profile-btn" onclick="updateProfile()">
          <span class="btn-text">Save Changes</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </div>
  </section>

  <section class="account-section" id="password-form">
    <h2 class="account-section-title">Change Password</h2>

    <div id="password-error" class="form-error" style="display:none"></div>

    <div class="create-form">
      <div class="field">
        <label class="field-label" for="current_password">Current Password</label>
        <input
          class="field-input"
          type="password"
          id="current_password"
          placeholder="Your current password"
          autocomplete="current-password"
        />
      </div>

      <div class="field">
        <label class="field-label" for="new_password">New Password</label>
        <input
          class="field-input"
          type="password"
          id="new_password"
          placeholder="Min. 8 characters"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <label class="field-label" for="confirm_password">Confirm New Password</label>
        <input
          class="field-input"
          type="password"
          id="confirm_password"
          placeholder="Repeat new password"
          autocomplete="new-password"
        />
      </div>

      <div class="form-footer" style="justify-content:flex-end;">
        <button class="btn-submit" id="password-btn" onclick="changePassword()">
          <span class="btn-text">Change Password</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </div>
  </section>

  <section class="account-section account-section-danger">
    <h2 class="account-section-title">Danger Zone</h2>
    <div class="danger-zone">
      <p class="danger-desc">
        Permanently delete your account and all associated posts.
        This action is irreversible.
      </p>
      <button class="btn-danger" onclick="deleteAccount()">
        Delete Account
      </button>
    </div>
  </section>

</div>

{% endblock content %}
