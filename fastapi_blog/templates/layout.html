<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if title %} PositiveBlog — {{ title }} {% else %} PositiveBlog {% endif
      %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --cream: #faf6f0;
        --warm-white: #fffdf9;
        --ink: #1a1510;
        --ink-soft: #3d3428;
        --muted: #9e8f7e;
        --accent: #c8622a;
        --accent-soft: #f0ddd0;
        --border: #e8ddd0;
        --shadow: rgba(26, 21, 16, 0.08);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--ink);
        min-height: 100vh;
        line-height: 1.6;
        position: relative;
        overflow-x: hidden;
      }

      /* Grain texture overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
        opacity: 0.5;
      }

      /* ── HEADER ── */
      header {
        background: var(--warm-white);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(12px);
        animation: slideDown 0.6s ease both;
      }

      @keyframes slideDown {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .header-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        color: var(--ink);
        text-decoration: none;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        display: inline-block;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.4);
          opacity: 0.7;
        }
      }

      nav {
        display: flex;
        gap: 2rem;
        align-items: center;
      }

      nav a {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: color 0.2s;
        position: relative;
      }

      nav a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease;
      }

      nav a:hover {
        color: var(--ink);
      }
      nav a:hover::after {
        transform: scaleX(1);
      }

      /* ── HERO BANNER ── */
      .hero {
        background: var(--ink);
        color: var(--cream);
        text-align: center;
        padding: 5rem 2rem 4rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.8s 0.2s ease both;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 80% 60% at 50% 100%,
          rgba(200, 98, 42, 0.25) 0%,
          transparent 70%
        );
      }

      .hero-eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1rem;
        font-weight: 500;
      }

      .hero h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.8rem, 6vw, 5rem);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin-bottom: 1rem;
        position: relative;
      }

      .hero h1 em {
        font-style: italic;
        color: var(--accent);
      }

      .hero-sub {
        font-size: 1rem;
        color: #a09080;
        max-width: 420px;
        margin: 0 auto;
        font-weight: 300;
      }

      /* ── MAIN ── */
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 4rem 2rem;
        animation: fadeUp 0.8s 0.4s ease both;
      }

      @keyframes fadeUp {
        from {
          transform: translateY(24px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* ── FOOTER ── */
      footer {
        border-top: 1px solid var(--border);
        padding: 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      footer span {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="/" class="logo">
          <span class="logo-dot"></span>
          PositiveBlog
        </a>
        <nav>
          <a href="/">Home</a>
          <a href="/posts">Posts</a>
          <a href="/api/posts">API</a>
        </nav>
      </div>
    </header>

    <div class="hero">
      <p class="hero-eyebrow">Daily Inspiration</p>
      <h1>Good things <em>happen</em><br />every day</h1>
      <p class="hero-sub">Stories worth reading, moments worth sharing.</p>
    </div>

    <main>{% block content %} {% endblock content %}</main>

    <footer>
      <p>Made with <span>♥</span> &nbsp;·&nbsp; PositiveBlog © 2025</p>
    </footer>
  </body>
</html>
