{% extends "layout.html" %} {% block content %}

<link rel="stylesheet" href="/static/css/create.css" />

<a href="/posts/{{ post.id }}" class="back-link">
  <span class="back-arrow">←</span> Back to post
</a>

<div class="create-wrapper">
  <h1 class="create-title">Edit Post</h1>
  <p class="create-subtitle">Update your story</p>

  <div class="divider"></div>

  <div id="form-error" class="form-error" style="display: none"></div>

  <div class="create-form">
    <div class="field">
      <div class="field-label-row">
        <label class="field-label" for="title">Title</label>
        <span id="title-counter" class="field-counter">0 / 100</span>
      </div>
      <input
        class="field-input"
        type="text"
        id="title"
        value="{{ post.title }}"
        placeholder="What's your story about?"
        maxlength="100"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label class="field-label" for="content">Content</label>
      <textarea
        class="field-input field-textarea"
        id="content"
        placeholder="Tell your story…"
        rows="10"
      >
{{ post.content }}</textarea
      >
    </div>

    <div class="form-footer">
      <a href="/posts/{{ post.id }}" class="btn-cancel">Cancel</a>
      <button class="btn-submit" data-post-id="{{ post.id }}" onclick="updatePost(+this.dataset.postId)">

    </div>
  </div>
</div>

{% endblock content %}
